version: 1
description: Capability-maturity vocabulary for productized bio-agent surfaces.

vocabulary:
  execution_tier:
    first_party_executable: Productized hero workflow surfaced through the canonical bio-agent session/run control plane.
    bridge_executable: Runnable capability exposed through discovered tool/skill bridges, but not yet packaged as a first-party hero lane.
    reference_only: Grounded workflow or knowledge surface kept for planning/reference honesty rather than direct first-party execution claims.
  runtime_mode:
    session-hero-runner: Thin adapter over canonical session/run truth.
    local-cli: Depends on a locally available tool bridge.
    prompt-bridge: Skill/prompt surface without a verified local executable contract.
    planning-reference: Registry/documentation-only capability used for planning and comparison.
  verification_level:
    benchmark_contract: Backed by benchmark contract checks and smoke coverage.
    machine_detected: Local executable or command bridge detected on this machine.
    declared_only: Declared by metadata but not currently verified as locally available.
    registry_modeled: Grounded in workflow/benchmark registries only.
  reproducibility_level:
    automatic_session_bundle: Hero runner emits a reproducibility bundle automatically.
    manual_bridge: Reproducibility depends on operator-managed bridge/tool usage.
    not_packaged: No first-party reproducibility bundle is promised yet.

hero_workflows:
  - workflow_id: rnaseq-differential-expression
    title: Bulk RNA-seq differential expression
    verification_level: benchmark_contract
    reproducibility_level: automatic_session_bundle
  - workflow_id: germline-short-variant-discovery
    title: Germline short variant discovery
    verification_level: benchmark_contract
    reproducibility_level: automatic_session_bundle
