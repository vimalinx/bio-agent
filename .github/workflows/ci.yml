name: ci

on:
  push:
  pull_request:

jobs:
  stable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pyyaml
      - name: Stable regression lane
        run: bash scripts/ci/run_stable_tests.sh

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install smoke dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pyyaml
      - name: Hero runner smoke lane
        run: bash scripts/ci/run_smoke_tests.sh
