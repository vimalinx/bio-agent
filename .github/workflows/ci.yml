name: CI

on:
  pull_request:
  push:
  workflow_dispatch:
    inputs:
      run_optional_evidence_lane:
        description: Run the optional evidence-backed integration lane.
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  stable-regression:
    name: Stable regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install lightweight test dependencies
        run: python -m pip install --upgrade pip pyyaml
      - name: Run stable pytest lane
        run: bash scripts/ci/run_stable_tests.sh

  benchmark-contract:
    name: Benchmark contract lane
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install lightweight test dependencies
        run: python -m pip install --upgrade pip pyyaml
      - name: Run contract benchmark suite
        run: python3 scripts/bio_skill_system.py benchmark-suite --mode contract

  hero-lane-truth-smoke:
    name: Hero lane truth smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install lightweight test dependencies
        run: python -m pip install --upgrade pip pyyaml
      - name: Run session-backed hero lane smoke checks
        run: python3 scripts/ci/run_session_hero_smoke.py

  optional-evidence-integration:
    name: Optional evidence integration
    if: github.event_name == 'workflow_dispatch' && inputs.run_optional_evidence_lane
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install lightweight test dependencies
        run: python -m pip install --upgrade pip pyyaml
      - name: Run evidence-backed benchmark lane
        run: |
          python3 scripts/bio_skill_system.py benchmark-suite \
            --benchmark-id giab-precisionfda-small-variant \
            --mode evidence \
            --evidence-root examples/benchmarks
